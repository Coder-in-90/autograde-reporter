name: 'Coder in 90 autograde reporter'
description: >-
  Build the cin90 results payload from a pytest JSON report and POST it to the
  Classroom ingest endpoint, authenticated with a GitHub Actions OIDC token.
  No secrets required: `permissions: id-token: write` on the job is what lets
  the reporter ask GitHub to mint the token.

inputs:
  base-url:
    description: 'Base URL of the cin90 deployment to report to (no trailing slash).'
    default: 'https://coderin90.com'
  results:
    description: 'Path to the pytest JSON report (pytest-json-report --json-report-file).'
    default: 'report.json'
  pytest-output:
    description: 'Path to the captured pytest console output.'
    default: 'pytest_output.txt'
  pr-number:
    description: >-
      Pull request number to attach the result to. Defaults to the pull request
      that triggered the run; set it only to override that.
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Build results.json
      # Both this and the report step below run unconditionally: the caller's
      # test step swallows its own exit code, but a composite step that fails
      # would otherwise skip everything after it, and a run that reports
      # nothing leaves the submission looking un-submitted.
      if: always()
      shell: bash
      run: |
        python '${{ github.action_path }}/scripts/build_results.py' \
          '${{ inputs.results }}' '${{ inputs.pytest-output }}'

    - name: Report to Coder in 90
      if: always()
      shell: bash
      env:
        CIN90_BASE_URL: ${{ inputs.base-url }}
        # Derived here rather than left to the caller: without it every result
        # arrives with no pull request attached and feedback silently degrades
        # from inline review comments to an issue comment.
        PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
        # Also derived here, and it cannot be done in the caller's workflow at
        # all: on a pull_request event Actions sets GITHUB_SHA to the merge
        # commit rather than the pushed head, and an `env:` override of a
        # GITHUB_* variable is silently ignored. Without this the push and
        # pull_request runs of one commit report different shas, cin90's
        # dedupe misses, and the commit is graded and explained twice (#397).
        CIN90_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        echo "autograde-reporter: reporting to $CIN90_BASE_URL"
        python '${{ github.action_path }}/scripts/report_autograde.py' results.json

    - name: Fail the check when the grade is failing
      # Last, and always: the result is already delivered by the step above, so
      # an honest check cannot cost anyone their grade. Without this the job's
      # conclusion is `success` whatever the student scored, and the student
      # reads the green tick as "my work passed" (#395).
      if: always()
      shell: bash
      run: python '${{ github.action_path }}/scripts/check_grade.py' results.json
